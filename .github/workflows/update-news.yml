name: Refresh ChronoGlobe news archive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: refresh-chrono-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh rolling news dataset
        run: python scripts/update_news.py
      - name: Commit dataset when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-news.json
          if git diff --cached --quiet; then
            echo "No feed changes to commit."
          else
            git commit -m "Refresh rolling ChronoGlobe news feed"
            git push
          fi
